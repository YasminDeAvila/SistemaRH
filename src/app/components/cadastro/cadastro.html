<div class="flex flex-col items-center justify-center h-screen ">
    <h3 class="text-2xl font-bold mb-4 text-purple-700">Cadastro - Crie sua conta</h3>

    <div class="bg-white p-8 rounded shadow-md max-w-md w-full flex flex-col">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome"
            class="mb-4 focus:border-purple-500 w-full rounded p-2 border border-purple-300">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email"
            class="mb-4 focus:border-purple-500 w-full rounded p-2 border border-purple-300">

        

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
            class="mb-4 focus:border-purple-500 w-full rounded p-2 border border-purple-300">

        <label for="confirmarSenha">Confirmar Senha:</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha"
            class="mb-4 focus:border-purple-500 w-full rounded p-2 border border-purple-300">

        <button type="button"
            class="w-full bg-purple-600 text-white p-3 rounded-lg hover:bg-purple-700 ">Cadastrar</button>

        <a routerLink="/login" class="text-purple-600 hover:text-purple-800 mt-4 text-center">Já tem uma conta? Faça
            login</a>

    </div>
</div>
