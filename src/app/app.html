<header class="flex flex-wrap p-4 bg-purple-100 text-purple-700 gap-6 justify-center items-center">
  <nav class="flex flex-wrap gap-6 justify-center bg-purple-100 items-center">

    <h1 class="text-2xl font-bold text-purple-700">Sistema RH</h1>
    <ul class="flex flex-wrap items-center gap-2">

      @if (auth.estaLogado()) {

      <li>
        <a routerLink="/funcionarios" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }"
          class="block rounded-md px-3 py-2 text-sm font-medium transition-colors hover:text-purple-800">
          Lista de funcionários
        </a>
      </li>

      <li>
        <a routerLink="/funcionarios/novo" routerLinkActive="ativo"
          class="block rounded-md px-3 py-2 text-sm font-medium transition-colors hover:text-purple-800">
          Novo funcionário
        </a>
      </li>

      <li>
        <a routerLink="/enderecos" routerLinkActive="ativo"
          class="block rounded-md px-3 py-2 text-sm font-medium transition-colors hover:text-purple-800">
          Endereços
        </a>
      </li>

      <li>
        <a routerLink="/contatos" routerLinkActive="ativo"
          class="block rounded-md px-3 py-2 text-sm font-medium transition-colors hover:text-purple-800">
          Contatos
        </a>
      </li>

      <li>
        <button (click)="auth.logout()"
          class="rounded-md px-3 py-2 text-sm font-medium text-purple-700 hover:text-purple-900">
          Sair
        </button>
      </li>
      } @else {

      <li>
        <a routerLink="/login"
          class="block rounded-md bg-purple-700 text-white px-4 py-2 text-sm font-medium transition-colors hover:bg-purple-800">
          Login
        </a>
      </li>

      <li>
        <a routerLink="/cadastro"
          class="block rounded-md bg-transparent border border-purple-500 text-purple-600 px-4 py-2 text-sm font-medium transition-colors hover:bg-purple-700 hover:text-white">
          Cadastro
        </a>
      </li>

      }

    </ul>
  </nav>
</header>

<router-outlet></router-outlet>
